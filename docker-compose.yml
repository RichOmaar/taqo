services:
  postgres:
    image: postgres:16-alpine
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa
      POSTGRES_DB: nexa
    # Published inside the block reserved for Nexa (see packages/ports) so it
    # never clashes with another project's Postgres. Override in the root .env.
    ports:
      - '${NEXA_POSTGRES_PORT:-9020}:5432'
    volumes:
      - nexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexa -d nexa']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexa-postgres-data:
